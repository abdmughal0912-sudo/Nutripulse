[theme]
base = "dark"
primaryColor = "#BFF56D"
backgroundColor = "#040806"
secondaryBackgroundColor = "#0B1512"
textColor = "#F8FBF9"
font = "sans serif"

[server]
maxUploadSize = 20
maxMessageSize = 50
headless = true
runOnSave = false
address = "0.0.0.0"
port = 8501
enableXsrfProtection = true

[browser]
gatherUsageStats = false
