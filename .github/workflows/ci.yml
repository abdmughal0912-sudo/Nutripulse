name: NutriPulse validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nutripulse-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check runtime imports
        run: python scripts/runtime_check.py

      - name: Run automated tests
        run: python -m unittest discover -s tests -v

      - name: Run model and data smoke test
        run: python scripts/smoke_test.py

      - name: Render all role-based pages
        run: python scripts/ui_smoke_test.py
